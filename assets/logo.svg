<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep obsidian dark background -->
    <radialGradient id="bg-glow" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#141826" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#080a12" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#040508" stop-opacity="1"/>
    </radialGradient>

    <!-- Continuous Rainbow Flow for 'C' Glow -->
    <linearGradient id="rainbow-c-glow" x1="100%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF334B"/>
      <stop offset="20%" stop-color="#FF8C00"/>
      <stop offset="40%" stop-color="#FFD600"/>
      <stop offset="55%" stop-color="#00E676"/>
      <stop offset="70%" stop-color="#00B0FF"/>
      <stop offset="85%" stop-color="#651FFF"/>
      <stop offset="100%" stop-color="#D500F9"/>
    </linearGradient>

    <!-- Segment 1: Red (355, 155) -> Orange (180, 135) -->
    <linearGradient id="seg-1-grad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF2D55"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>

    <!-- Segment 2: Orange (180, 135) -> Green (120, 256) -->
    <linearGradient id="seg-2-grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9500"/>
      <stop offset="45%" stop-color="#FFCC00"/>
      <stop offset="100%" stop-color="#30D158"/>
    </linearGradient>

    <!-- Segment 3: Green (120, 256) -> Blue (180, 377) -->
    <linearGradient id="seg-3-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30D158"/>
      <stop offset="50%" stop-color="#00C7BE"/>
      <stop offset="100%" stop-color="#0A84FF"/>
    </linearGradient>

    <!-- Segment 4: Blue (180, 377) -> Violet (355, 357) -->
    <linearGradient id="seg-4-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="50%" stop-color="#5E5CE6"/>
      <stop offset="100%" stop-color="#BF5AF2"/>
    </linearGradient>

    <!-- Mechanical Joint Dark Void Fill -->
    <linearGradient id="joint-void" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="100%" stop-color="#121624"/>
    </linearGradient>

    <!-- Steam-like Depth Shadows -->
    <filter id="chain-depth" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-4" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <!-- Soft Ambient Backlight -->
    <filter id="ambient-blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="36" result="blur"/>
    </filter>
  </defs>

  <!-- Clean dark container -->
  <rect width="512" height="512" rx="112" fill="url(#bg-glow)" stroke="#1a202e" stroke-width="1.5" />

  <!-- Ambient Rainbow Glow -->
  <circle cx="284" cy="256" r="148" fill="url(#rainbow-c-glow)" opacity="0.13" filter="url(#ambient-blur)" />

  <g id="segmented-c-rig">
    <!-- Five joints on one circle (centre 284,256, r 148), 60 degrees apart; the bones are arcs of that circle -->
    <!-- J1 (358.0, 127.8) -> J2 (210.0, 127.8) -> J3 (136.0, 256.0) -> J4 (210.0, 384.2) -> J5 (358.0, 384.2) -->
    <!-- 1. BONES -->
    <path d="M 358.0 127.8 A 148 148 0 0 0 210.0 127.8" fill="none" stroke="url(#seg-1-grad)" stroke-width="50" stroke-linecap="round" />
    <path d="M 210.0 384.2 A 148 148 0 0 0 358.0 384.2" fill="none" stroke="url(#seg-4-grad)" stroke-width="50" stroke-linecap="round" />
    <g filter="url(#chain-depth)">
      <path d="M 210.0 127.8 A 148 148 0 0 0 136.0 256.0" fill="none" stroke="url(#seg-2-grad)" stroke-width="50" stroke-linecap="round" />
    </g>
    <g filter="url(#chain-depth)">
      <path d="M 136.0 256.0 A 148 148 0 0 0 210.0 384.2" fill="none" stroke="url(#seg-3-grad)" stroke-width="50" stroke-linecap="round" />
    </g>

    <!-- 2. INTERMEDIATE JOINTS (J2 orange, J4 blue) -->
    <g filter="url(#chain-depth)">
      <circle cx="210.0" cy="127.8" r="40" fill="#FF9500" />
      <circle cx="210.0" cy="127.8" r="16" fill="url(#joint-void)" stroke="#090b12" stroke-width="2" />
      <circle cx="210.0" cy="384.2" r="40" fill="#0A84FF" />
      <circle cx="210.0" cy="384.2" r="16" fill="url(#joint-void)" stroke="#090b12" stroke-width="2" />
    </g>

    <!-- 3. TERMINAL JOINTS (J1 red, J5 violet) AND THE APEX (J3 green) -->
    <g filter="url(#chain-depth)">
      <circle cx="358.0" cy="127.8" r="38" fill="#FF2D55" />
      <circle cx="358.0" cy="127.8" r="15" fill="url(#joint-void)" stroke="#090b12" stroke-width="2" />
      <circle cx="358.0" cy="384.2" r="38" fill="#BF5AF2" />
      <circle cx="358.0" cy="384.2" r="15" fill="url(#joint-void)" stroke="#090b12" stroke-width="2" />
      <circle cx="136.0" cy="256.0" r="56" fill="#30D158" />
      <circle cx="136.0" cy="256.0" r="23" fill="url(#joint-void)" stroke="#090b12" stroke-width="2.5" />
      <circle cx="136.0" cy="256.0" r="7.5" fill="#30D158" />
    </g>
  </g>
</svg>

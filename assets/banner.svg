<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="100%" height="100%">
  <defs>
    <!-- Background dark obsidian gradient -->
    <linearGradient id="banner-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0f1b"/>
      <stop offset="50%" stop-color="#070912"/>
      <stop offset="100%" stop-color="#040508"/>
    </linearGradient>

    <!-- Multi-stop Continuous Rainbow Spectrum -->
    <linearGradient id="rainbow-c-glow" x1="100%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF334B"/>
      <stop offset="20%" stop-color="#FF8C00"/>
      <stop offset="40%" stop-color="#FFD600"/>
      <stop offset="55%" stop-color="#00E676"/>
      <stop offset="70%" stop-color="#00B0FF"/>
      <stop offset="85%" stop-color="#651FFF"/>
      <stop offset="100%" stop-color="#D500F9"/>
    </linearGradient>

    <!-- Segment Gradients -->
    <linearGradient id="seg-1-grad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF2D55"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>

    <linearGradient id="seg-2-grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9500"/>
      <stop offset="45%" stop-color="#FFCC00"/>
      <stop offset="100%" stop-color="#30D158"/>
    </linearGradient>

    <linearGradient id="seg-3-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30D158"/>
      <stop offset="50%" stop-color="#00C7BE"/>
      <stop offset="100%" stop-color="#0A84FF"/>
    </linearGradient>

    <linearGradient id="seg-4-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="50%" stop-color="#5E5CE6"/>
      <stop offset="100%" stop-color="#BF5AF2"/>
    </linearGradient>

    <!-- Joint Void Fill -->
    <linearGradient id="joint-void" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="100%" stop-color="#121624"/>
    </linearGradient>

    <!-- Typography Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Depth Shadow -->
    <filter id="chain-depth" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-4" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <!-- Soft Ambient Backlight -->
    <filter id="ambient-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
    </filter>
  </defs>

  <!-- Clean dark container with subtle border -->
  <rect width="880" height="240" rx="20" fill="url(#banner-bg)" stroke="#1a202c" stroke-width="1.5" />

  <!-- Ambient Rainbow Glow behind 'C' -->
  <circle cx="159.3" cy="121.5" r="62.2" fill="url(#rainbow-c-glow)" opacity="0.12" filter="url(#ambient-blur)" />

  <!-- Left 5-Joint Segmented 'C' Skeletal Rig Emblem -->
  <g transform="translate(40, 14) scale(0.42)">
    <!-- Five joints on one circle (centre 284,256, r 148), 60 degrees apart; the bones are arcs of that circle -->
    <!-- J1 (358.0, 127.8) -> J2 (210.0, 127.8) -> J3 (136.0, 256.0) -> J4 (210.0, 384.2) -> J5 (358.0, 384.2) -->
    <!-- 1. BONES -->
    <path d="M 358.0 127.8 A 148 148 0 0 0 210.0 127.8" fill="none" stroke="url(#seg-1-grad)" stroke-width="50" stroke-linecap="round" />
    <path d="M 210.0 384.2 A 148 148 0 0 0 358.0 384.2" fill="none" stroke="url(#seg-4-grad)" stroke-width="50" stroke-linecap="round" />
    <g filter="url(#chain-depth)">
      <path d="M 210.0 127.8 A 148 148 0 0 0 136.0 256.0" fill="none" stroke="url(#seg-2-grad)" stroke-width="50" stroke-linecap="round" />
    </g>
    <g filter="url(#chain-depth)">
      <path d="M 136.0 256.0 A 148 148 0 0 0 210.0 384.2" fill="none" stroke="url(#seg-3-grad)" stroke-width="50" stroke-linecap="round" />
    </g>

    <!-- 2. INTERMEDIATE JOINTS (J2 orange, J4 blue) -->
    <g filter="url(#chain-depth)">
      <circle cx="210.0" cy="127.8" r="40" fill="#FF9500" />
      <circle cx="210.0" cy="127.8" r="16" fill="url(#joint-void)" stroke="#090b12" stroke-width="2" />
      <circle cx="210.0" cy="384.2" r="40" fill="#0A84FF" />
      <circle cx="210.0" cy="384.2" r="16" fill="url(#joint-void)" stroke="#090b12" stroke-width="2" />
    </g>

    <!-- 3. TERMINAL JOINTS (J1 red, J5 violet) AND THE APEX (J3 green) -->
    <g filter="url(#chain-depth)">
      <circle cx="358.0" cy="127.8" r="38" fill="#FF2D55" />
      <circle cx="358.0" cy="127.8" r="15" fill="url(#joint-void)" stroke="#090b12" stroke-width="2" />
      <circle cx="358.0" cy="384.2" r="38" fill="#BF5AF2" />
      <circle cx="358.0" cy="384.2" r="15" fill="url(#joint-void)" stroke="#090b12" stroke-width="2" />
      <circle cx="136.0" cy="256.0" r="56" fill="#30D158" />
      <circle cx="136.0" cy="256.0" r="23" fill="url(#joint-void)" stroke="#090b12" stroke-width="2.5" />
      <circle cx="136.0" cy="256.0" r="7.5" fill="#30D158" />
    </g>
  </g>

  <!-- Typography & Feature Badges -->
  <g transform="translate(268, 0)">
    <!-- Main Title -->
    <text x="0" y="105" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.5">
      <tspan fill="url(#text-grad)">rig</tspan><tspan fill="url(#rainbow-c-glow)">c</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="145" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94A3B8" letter-spacing="-0.2">
      Declarative rig compiler &amp; validator for Spine 2D skeletal data
    </text>

    <!-- Clean Badges -->
    <g transform="translate(2, 168)">
      <!-- Badge 1: AI Spectrum -->
      <rect x="0" y="0" width="144" height="26" rx="6" fill="#151926" stroke="#1e293b" stroke-width="1" />
      <text x="72" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#FF9500" text-anchor="middle">🌈 AI-AGENT NATIVE</text>

      <!-- Badge 2: Declarative Specs -->
      <rect x="152" y="0" width="144" height="26" rx="6" fill="#151926" stroke="#1e293b" stroke-width="1" />
      <text x="224" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#30D158" text-anchor="middle">⚡ DECLARATIVE SPECS</text>

      <!-- Badge 3: the verification mechanism - a spine-core round-trip, which is
           what the tagline says. Deliberately not "SPINE-CORE VERIFIED": a shield
           plus caps plus "VERIFIED" is the visual grammar of a third-party
           certification mark, and nobody certifies rigc - it round-trips THROUGH
           spine-core. Same claim, stated as the mechanism it is. -->
      <rect x="304" y="0" width="172" height="26" rx="6" fill="#151926" stroke="#1e293b" stroke-width="1" />
      <text x="390" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0A84FF" text-anchor="middle">🛡️ SPINE-CORE ROUND-TRIP</text>
    </g>
  </g>
</svg>

# The selftest as n shards and their merge: the one definition of the gate's
# shape, called by ci.yml on every change and by release.yml on the tag it is
# about to publish (issue #1249). Two copies of the matrix, the `--tally-out`
# wiring, the merge's flags and the corpus fetch would be two gates that can
# drift apart, which is the #1003 fault in another form — so there is one, and
# `CUR120` in selftest.ts holds that both callers call this file and that no
# other workflow defines the shards.
#
# It writes one artifact a caller may read beyond the bases below:
# `selftest-merged-tally`, the merged run's document (`--merge … --tally-out`).
# It names the commit every shard and the merge ran at, every shard's exit, the
# merge's exit and the census of every registered suite, and it is what
# release.yml's publish hands `prepublishOnly` through `RIGC_PREPUBLISH_TALLY`
# — see scripts/prepublish_gate.ts for what is held before it is accepted.
name: selftest-shards

on:
  workflow_call:
    inputs:
      ref:
        # Empty is the caller's own event ref — what ci.yml has always checked
        # out. release.yml passes the tag it is about to publish.
        description: The ref to check out in every job; empty for the caller's event ref
        required: false
        type: string
        default: ''
    outputs:
      verdict:
        description: '"green" when the merge of every shard exited 0, and empty otherwise'
        value: ${{ jobs.test.outputs.verdict }}

permissions:
  contents: read

jobs:
  # The selftest as n shards side by side, each a process of its own on a runner
  # of its own (issue #1116). Every shard runs the suites dealt to it —
  # longest-first over `tools/selftest_shards.base.json`, round-robin for a suite
  # the base has no entry for (issue #1128) — and writes what it ran as a tally
  # document; the `test` job below merges them, and that merge is the verdict.
  # Inside a shard a suite's independent units run up to `--jobs` at once, and
  # `--jobs` defaults to the runner's cores (4 here), so no flag is passed.
  #
  # ⏱️ Why `n` is 6, measured on the one-process run of main at 1c36d4d (run
  # 37131671933: the selftest step 15m41s, 941.2 s of suites): the suites dealt
  # round-robin by registration index, less the three the merge runs, give the
  # heaviest shard 376 s at n = 3, 364 s at n = 4 (whose first shard gets 45 s),
  # 311 s at n = 5 and 208 s at n = 6 — and no n can go under `render-hashes`
  # alone, 194.9 s, which is one suite and lands in shard 6. Six is the
  # smallest n at that floor; past it, n = 7 and n = 8 measure 255 s and 242 s,
  # because round-robin stops lining the heavy suites up apart. The runner's
  # four cores do not bound n: each matrix job is its own runner, and none of
  # them runs more than one suite at a time.
  #
  # 🔒 The selftest step stays exactly `bun run selftest` (`CUR112` reads that
  # line, and its plant moves it), with the shard named through the environment
  # — `RIGC_SHARD`, `RIGC_TALLY_OUT`, the precedent `RIGC_CUTS` set. A green
  # shard exits 2, which is never a verdict and would fail the step, so the step
  # continues on error and the merge reads the exit the shard wrote into its
  # document: a red shard is red in the merge, by suite and FAIL line, and a
  # shard that never wrote a document is a shard the merge refuses as missing.
  shard:
    name: shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # One sixth of the run measured at 208 s for its heaviest shard; the ceiling
    # is for a hung step, as the one-process job's was.
    timeout-minutes: 30
    strategy:
      # Every shard runs to its end whatever another found: a red in shard 2 is
      # no reason not to read shard 5, and the merge names every red there is.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # The Spine example projects are fetched, not redistributed — see
      # NOTICE.md — so a fresh checkout has no examples/ and the suite has no
      # yardstick to measure against.
      #
      # The script lists directories through the GitHub contents API, which
      # allows 60 requests an hour unauthenticated; one run costs more than
      # that on a bad day, and the script's own message for the rate limit is
      # "export a GITHUB_TOKEN". It reads that variable directly, and sends it
      # to api.github.com only.
      #
      # Deliberately not cached: the script keeps any file already on disk, so a
      # restored cache would freeze the corpus and hide an example that changed
      # shape upstream. A yardstick that is never re-measured is not a yardstick.
      #
      # Deliberately not retried HERE either — the retry is per transfer, inside
      # the script (issue #335). Retrying this step would re-issue all 18
      # contents-API listings against a 60/hour budget, and would discard the
      # script's own report of which file failed from which URL. See the retry
      # block in scripts/fetch-examples.sh for the full argument.
      #
      # Since #1116 every shard fetches, and ci.yml's `linux-readings`: seven
      # fetches per CI run, each its own 18 listings under the same token; a
      # release run makes six here and one in its publish job.
      - name: Fetch the Spine example corpus
        run: bun run fetch-examples
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: bun run selftest
        continue-on-error: true
        env:
          RIGC_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          RIGC_TALLY_OUT: ${{ runner.temp }}/tally/shard-${{ matrix.shard }}.json

      - name: Upload this shard's tally document
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: selftest-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/tally/shard-${{ matrix.shard }}.json
          if-no-files-found: error

  # The verdict: every shard's document merged (issue #1116). `--merge` refuses
  # by name a set of documents that is not one run's shards each once, replays
  # the run in registration order off them, runs the three suites that read the
  # whole run (`seeded-random`, `run-tally`, `verdict-suppliers`) over every
  # shard's record, holds each shard's high-water to the platform's memory
  # ceiling, and prints the one-process summary — from the one-process code,
  # over the replayed numbers. It runs when a shard job failed too
  # (`!cancelled()`): a shard that wrote no document is then named as missing
  # here rather than leaving the check skipped.
  #
  # Named `test` here, and ci.yml keeps a job of that name too: a called
  # workflow's jobs report as "<caller job> / test", and `test` is the check
  # this repository's pull requests are required to pass, so ci.yml's own
  # `test` reads this job's `verdict` output and is that check.
  test:
    needs: shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - run: bun run typecheck
      - run: bun run lint

      - name: Download every shard's tally document
        uses: actions/download-artifact@v4
        with:
          pattern: selftest-shard-*
          path: ${{ runner.temp }}/tally
          merge-multiple: true
      # `--shards-base` writes the durations the next deal reads, off this
      # merge's own per-suite seconds (issue #1128). It is written only after a
      # green verdict and changes nothing else the merge prints or exits on; the
      # tracked base is rewritten from this artifact, so the deal is read off
      # CI's seconds rather than a laptop's. `--memory-base-children` (issue
      # #1144) writes, after the same green verdict, the linux entry's children's
      # half of `tools/selftest_memory.base.json` — each suite's largest child,
      # at the `--jobs` the shards ran at — and leaves the parent's high-water.
      # Since #1166 it keeps every tracked figure whatever the run read, so its
      # artifact needs committing only when it adds a suite's figure or was
      # written under `--reset-children-base`; no permission beyond the
      # `contents: read` above is needed for any of it. `--tally-out` (issue
      # #1249) writes the merged run's document on every way the merge ends
      # after reading its documents, red ones included, with the exit it ends on.
      - name: The merge of every shard is the verdict
        id: merge
        run: bun selftest.ts --merge "$RUNNER_TEMP"/tally/*.json --shards-base "$RUNNER_TEMP/selftest_shards.base.json" --memory-base-children "$RUNNER_TEMP/selftest_memory.base.json" --tally-out "$RUNNER_TEMP/selftest_merged.json"
      - name: Say the merge was green
        id: verdict
        run: echo "verdict=green" >> "$GITHUB_OUTPUT"
      - name: Upload the durations base this merge wrote
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: selftest-shards-base
          path: ${{ runner.temp }}/selftest_shards.base.json
          if-no-files-found: error
      - name: Upload the memory base this merge wrote
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: selftest-memory-base
          path: ${{ runner.temp }}/selftest_memory.base.json
          if-no-files-found: error
      - name: Upload the merged tally document
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: selftest-merged-tally
          path: ${{ runner.temp }}/selftest_merged.json
          if-no-files-found: error

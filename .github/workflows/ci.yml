# CI: typecheck, lint, and the selftest suite.
#
# The selftest is the gate that matters. Every assertion has a mutant that makes
# it fire, so a green run means the failures are still reachable — not merely
# that nothing threw. Nothing here asserts timing, and no step is allowed to
# report success on an empty corpus.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The release pull request gets a `pull_request` run like any other. What
  # GITHUB_TOKEN costs is not the run but its permission to start: the run lands
  # in `action_required`, so that pull request's required check reads as blocked
  # rather than absent, and approving it is a standing step of every cut — see
  # RELEASING.md. A run started from the Actions tab cannot stand in for that
  # approval; a required check is matched by the run that reported it, not by the
  # SHA. So the trigger below is a manual lever for running the suite on an
  # arbitrary ref, and nothing more.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # The Spine example projects are fetched, not redistributed — see
      # NOTICE.md — so a fresh checkout has no examples/ and the suite has no
      # yardstick to measure against.
      #
      # The script lists directories through the GitHub contents API, which
      # allows 60 requests an hour unauthenticated; one run costs more than
      # that on a bad day, and the script's own message for the rate limit is
      # "export a GITHUB_TOKEN". It reads that variable directly, and sends it
      # to api.github.com only.
      #
      # Deliberately not cached: the script keeps any file already on disk, so a
      # restored cache would freeze the corpus and hide an example that changed
      # shape upstream. A yardstick that is never re-measured is not a yardstick.
      #
      # Deliberately not retried HERE either — the retry is per transfer, inside
      # the script (issue #335). Retrying this step would re-issue all 18
      # contents-API listings against a 60/hour budget, and would discard the
      # script's own report of which file failed from which URL. See the retry
      # block in scripts/fetch-examples.sh for the full argument.
      - name: Fetch the Spine example corpus
        run: bun run fetch-examples
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: bun run typecheck
      - run: bun run lint
      - run: bun run selftest

  # What a control leaving the tree looks like, which is nothing (issue #508).
  #
  # 🚨 **The incident.** Pull request #503 removed three controls and two
  # conversions that #502 had landed two hours before it. Nothing went red. Every
  # suite still reported, and the summary's own DERIVED figures moved down with
  # the loss rather than contradicting it — a tally that counts what the run
  # printed reports 584 as honestly as 587. It was found three landings later, by
  # somebody who went looking for a control they had been told to build on.
  #
  # 🔒 **No gate in the suite could have caught it, and the reason is structural
  # rather than an oversight.** The defence against hand-kept figures is
  # derivation, and derivation is exactly what made this invisible: a derived
  # count has no opinion about what SHOULD have been there, and giving it one
  # means a literal expected count — the `✅ applied` antipattern — or a table of
  # allowed removals, which is the same thing with rows. ⇒ What was lost is not a
  # property of one commit. It is a RELATION between two, and that is why it is
  # here and not in `selftest.ts`.
  #
  # ⭐ **Measured before it was placed.** `bun run selftest` is self-contained by
  # contract: a fresh clone runs it with no arguments and no network. Reading git
  # would not have broken that — the suite already shells out to `git ls-files`,
  # `git status` and `git check-ignore`, so git is a dependency it has. What it
  # cannot have is the RELATION: on a checkout at `main`, `git merge-base HEAD
  # main` is `HEAD`, so the removal set is empty by construction and the control
  # would report a pass having compared a revision with itself. That covers the
  # push-to-`main` run above, a fresh clone, and a release tag. A check that can
  # only be vacuous or SKIP on every run the suite is defined for is the "gate
  # that looks kept while checking nothing" this repository refuses, so the
  # workflow is the right place rather than the compromise.
  #
  # 🔒 **Removals are sometimes correct, so the rule is not that they are
  # forbidden**: #448 deleted a control that was checking itself and #468 removed
  # a branch nothing could reach. The rule is that **a removal is named in the
  # change that makes it** — which needs no allow-list, because the permission and
  # the diff are the same object.
  #
  # ⚠️ **What it costs, measured over the 80 landings before it was written.**
  # Three of those 80 removed a control name. #503 named none of its three and is
  # refused. #413 removed `SF03_…_CANNOT_…` in the act of replacing it and names
  # `SF03`, so it passes. #391 took `parallax` back out and names `JG01–JG03` as a
  # RANGE, so `JG01` and `JG03` are found and `JG02`, `DP05`, `DP06` and `DP07`
  # are not: that landing would have been asked to write four more codes. The two
  # relaxations that would have rescued it were measured and refused — expanding
  # an en-dash range buys one of the four and adds a grammar nobody would predict,
  # and accepting the letter FAMILY (`DP`, `JG`) buys one more while giving up the
  # only thing the declaration is for, which is saying WHICH control goes. It
  # would still have refused #503, and that is not enough to make it the rule.
  #
  # 🚨 **That paragraph described a rule the code did not implement (issue
  # #513).** A removal was declared by its name's FIRST SEGMENT, and the first
  # segment is a family word for a large minority of the names this scan catches:
  # every positive control in the suite answers to `CONTROL`, and a suite code is
  # no safer, because `T01` names a different control in three different suites.
  # Writing one word therefore permitted removing any member of its family — the
  # relaxation refused in the prose above was present in the code, arrived at by
  # how the code was extracted rather than by a decision anybody made. A rule that
  # refuses something in prose and does it in code is worse than one that does it
  # openly, because the prose is what a reader trusts. The run now prints the
  # split it derives instead of a figure written here.
  #
  # ⇒ **The declaration is the first segment where that segment names ONE control
  # in the base, and the whole name where it names several.** Derived per run off
  # the revision the removal is measured against, so there is no table and it
  # cannot loosen by itself: a code that is unique today and crowded tomorrow
  # starts demanding the whole name the moment the second name lands. Replayed
  # over the same three landings every verdict above is unchanged — #503 refused
  # on all three, #413 accepted, #391 refused on the same four — and that is what
  # chose it over declaring everything by its whole name, which flips #413 to
  # refused and buys nothing: `SF03` named exactly one control in the revision it
  # left.
  #
  # ⚠️ **Measured on the BASE side, not the branch's.** A declaration answers
  # which control WENT, and what could have gone is what the base carried. #413 is
  # the case that separates the two readings: it replaced `SF03`'s sentence, so
  # the branch still carries an `SF03_…` name and a branch-side reading would
  # demand the whole sentence for a code that named one thing at the moment it
  # left.
  #
  # ⛔ This job is not a required check until somebody makes it one in the
  # repository's settings, which is not a thing a file in the tree can assert.
  removals:
    # A relation between a branch and its base. A push to `main` has no such
    # relation to read, which is the same fact that keeps this out of the suite.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history, stated rather than inherited: the default depth is a single
      # commit and `git merge-base` needs both sides.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: A control that leaves is named by the change that removes it
        # 🔒 Through the environment and never interpolated into the script. A
        # pull request title and body are written by whoever opened it, so
        # `${{ }}` inside `run:` would be executing a stranger's text.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          work=$(mktemp -d)
          base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")

          # Where a control can be written, one pattern per place rather than one
          # alternation, so the floor below can be one ROW per place.
          scopes='^cli\.ts$ ^selftest\.ts$ ^src/.*\.ts$'

          # `-a` on the content scan, because a file that reads as binary to grep
          # answers an empty match with exit 0 and an absent one does the same
          # (issue #465 — `cli.ts` carried two raw NULs for a week and a plain
          # grep over it reported nothing at all).
          names () {
            : > "$2"
            for pattern in $scopes; do
              git ls-tree -r --name-only "$1" |
                grep -E "$pattern" |
                while read -r f; do git show "$1:$f"; done |
                grep -aoE '\b[A-Z][A-Za-z0-9]*(_[A-Za-z0-9]+){2,}\b' >> "$2"
            done
            sort -u -o "$2" "$2"
          }

          # 🚨 The floor, one row per scope and never one on their sum — the same
          # correction issue #510 made to `DQ01`, arrived at the same way: the
          # first version of this asked only whether EITHER side came back empty,
          # and a mutant that dropped `cli.ts` out of the pattern left 756 names
          # standing on the other two and ran green. A narrowing pattern is
          # invisible to a base-against-branch comparison, because it narrows
          # both sides at once, so the scope has to be held against the tree.
          thin=0
          for pattern in $scopes; do
            n=$(git ls-tree -r --name-only "$HEAD_SHA" | grep -cE "$pattern" || true)
            echo "  $pattern matches $n tracked file(s)"
            if [ "$n" -eq 0 ]; then thin=$((thin + 1)); fi
          done
          if [ "$thin" -gt 0 ]; then
            echo "$thin of the places a control can be written matched no file, so this scan is reading less of the tree than it says"
            exit 1
          fi

          names "$base" "$work/base"
          names "$HEAD_SHA" "$work/head"
          nb=$(wc -l < "$work/base")
          nh=$(wc -l < "$work/head")
          echo "base $base carries $nb control name(s); this branch carries $nh"
          if [ "$nb" -eq 0 ] || [ "$nh" -eq 0 ]; then
            echo "one side of the comparison came back empty, so nothing was compared"
            exit 1
          fi

          # The positive control, on every run and on a name this change is not
          # about: taken out of the branch side it has to be reported, left alone
          # it has to not be. A comparator that had stopped comparing passes the
          # judgement below in silence, and this is what refuses to let it.
          keep=$(comm -12 "$work/base" "$work/head" | head -n 1)
          grep -vxF "$keep" "$work/head" > "$work/planted"
          if ! comm -23 "$work/base" "$work/planted" | grep -qxF "$keep"; then
            echo "control: $keep was taken out of the branch side and the comparison did not report it"
            exit 1
          fi
          if comm -23 "$work/base" "$work/head" | grep -qxF "$keep"; then
            echo "control: $keep is in both revisions and the comparison reported it as removed"
            exit 1
          fi
          echo "control: $keep reported when planted, quiet when not"

          # Which first segments name more than one control in the base, derived
          # rather than listed — the split the declaration rule turns on, and the
          # reason it needs no table.
          sed 's/_.*//' "$work/base" | sort > "$work/segments"
          uniq -d < "$work/segments" > "$work/family"
          codes=$(uniq < "$work/segments" | wc -l)
          families=$(wc -l < "$work/family")
          crowded=$(grep -cxFf "$work/family" "$work/segments" || true)
          echo "the base's $nb name(s) carry $codes distinct first segment(s); $families of those name more than one control, between them covering $crowded name(s)"

          # What a change has to SAY to have declared one removal.
          needs () {
            code=${1%%_*}
            if grep -qxF "$code" "$work/family"; then printf '%s\n' "$1"; else printf '%s\n' "$code"; fi
          }

          # The judgement, written once so the control below and the real run are
          # the same code rather than two copies of it agreeing with each other.
          judge () { # $1 names that left, $2 what the change said, $3 row prefix
            undeclared=0
            while read -r name; do
              [ -n "$name" ] || continue
              need=$(needs "$name")
              if grep -qF "$need" "$2"; then
                echo "$3declared    $name (named as $need)"
              else
                echo "$3UNDECLARED  $name — write $need in a commit message on this branch, or in the title or body"
                undeclared=$((undeclared + 1))
              fi
            done < "$1"
          }

          # 🚨 The declaration rule's own positive control, two rows, on names
          # taken off this tree rather than written here — and red under the rule
          # it replaces, which asked for the first segment whatever it named.
          fam=$(head -n 1 "$work/family")
          famName=$(grep -m 1 -E "^${fam}_" "$work/base")
          sole=$(sed 's/_.*//' "$work/base" | sort | uniq -u | head -n 1)
          soleName=$(grep -m 1 -E "^${sole}_" "$work/base")
          if [ -z "$famName" ] || [ -z "$soleName" ]; then
            echo "control: the base carries no crowded first segment or no unique one, so the rule below cannot differ from the one it replaced and nothing here exercised the difference"
            exit 1
          fi
          printf '%s\n' "$famName" > "$work/c-gone"
          printf '%s\n' "$fam" > "$work/c-said"
          judge "$work/c-gone" "$work/c-said" "  control  "
          if [ "$undeclared" -ne 1 ]; then
            echo "control: the bare $fam was accepted as declaring $famName, and $fam is the first segment of $(grep -cE "^${fam}_" "$work/base") name(s) in the base"
            exit 1
          fi
          printf '%s\n' "$soleName" > "$work/c-gone"
          printf '%s\n' "$sole" > "$work/c-said"
          judge "$work/c-gone" "$work/c-said" "  control  "
          if [ "$undeclared" -ne 0 ]; then
            echo "control: $sole is the first segment of one name in the base and was not accepted as declaring $soleName"
            exit 1
          fi

          # What the change says about itself: every commit message on the branch,
          # plus the title and body, which are what the squash merge writes onto
          # `main` and therefore what a later reader will have.
          git log --format=%B "$base..$HEAD_SHA" > "$work/said"
          printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" >> "$work/said"

          comm -23 "$work/base" "$work/head" > "$work/gone"
          judge "$work/gone" "$work/said" "  "

          gone=$(wc -l < "$work/gone")
          echo "$gone control name(s) left the tree, $undeclared of them unnamed by the change that removed them"
          if [ "$undeclared" -gt 0 ]; then
            echo "a removal is allowed and a silent one is not: say which control goes and why, in the change itself"
            exit 1
          fi

  # What a landing that moves the published package looks like, which is nothing
  # (issue #516).
  #
  # 🚨 **The incident.** Twenty-two commits landed between `v0.20.0` and the
  # card, typed `test` (12), `docs` (8) and `ci` (2). All three are hidden from
  # the changelog, so release-please opened **nothing** — and four files inside
  # the published allowlist had changed: `docs/FACE.md` (141 lines),
  # `docs/AUTHORING.md` (101), `docs/INGEST.md` (26), and a comment in
  # `src/diff.ts` (18). The package moved and the release machinery had no
  # opinion about it, because **a release opens on commit TYPES while what ships
  # is decided by an ALLOWLIST** — two different facts, and nothing compared
  # them.
  #
  # ⛔ **The repair is not un-hiding `docs`.** Most of `docs/` does not ship, so
  # every note to a working document would open a release pull request and the
  # type would stop meaning anything. RELEASING.md states the principle that
  # would break: visibility is what makes a type releasable, and a type that is
  # always visible carries no information.
  #
  # 🔒 **The verdict is not "you used the wrong type".** A doc correction really
  # is a `docs` change. What is missing is that it also SHIPS, so what this job
  # says is *this landing changes the package and no release will open for it*,
  # and which remedy settles it is the author choice.
  #
  # ⭐ **It reads `npm pack --dry-run`, not the `files` array, and the difference
  # is not academic.** Measured on this tree: npm packs 55 paths where a literal
  # expansion of `files` yields 52. npm always adds `package.json`, the README
  # and the LICENCE on top of the allowlist, so **`README.md` ships and the array
  # does not name it** — and it is the second most edited file in the package
  # (109 landings touched `docs/AUTHORING.md`, 61 touched `README.md`, 45
  # touched `cli.ts`), 25 of those 61 under a type release-please hides. Those
  # 25 are the ones a literal reading of the array cannot see at all, and it is
  # equally blind to `package.json`, touched by 37. The `npm adds` row below
  # fires if this job ever regresses to that reading.
  #
  # ⚠️ **What it costs, measured by replaying the job body over the 205 landings
  # since the config grew a `changelog-sections` array** (#182, 2026-08-26 —
  # before that this job refuses on its own control, because a config with no
  # sections cannot tell a visible type from a hidden one). **160 pass, 45 are
  # refused**, and not one of the 45 is refused by a floor: every one of them
  # names at least one packed path, 88 rows between them. By subject type: 38
  # `docs`, 5 `test`, 1 `chore`, and one subject carrying no conventional type at
  # all. ⇒ What the card describes is not a one-off. It is the routine, 45 times.
  #
  # ⭐ **Twelve of those 45 are the card blind spot, measured.** Their only packed
  # change is `README.md`, `LICENSE` or `package.json` — the three npm adds on
  # its own — so a check that expanded the `files` array by hand passes all
  # twelve and calls it green. That is what chose `npm pack --dry-run` over the
  # array here, and the `npm adds` row is what stops the choice from quietly
  # reverting.
  #
  # 🔸 **The recurring cost is a word, not a release per landing.**
  # release-please keeps ONE release pull request open and updates it
  # (RELEASING.md, *Something releasable*), so ten shipped-guide corrections
  # typed to be visible accumulate into one cut rather than ten.
  #
  # ⚠️ **The type is read from the pull request TITLE and `Release-As:` from the
  # branch COMMIT MESSAGES, and that split is measured rather than assumed.** Of
  # the 303 landings since the bootstrap commit, 300 are squashes and the other
  # three are direct pushes inside the first six minutes. Over the newest 100
  # merged pull requests the subject on `main` is exactly the title plus ` (#N)`
  # on **86**; thirteen of the other fourteen differ only by issue references the
  # title carried at merge and no longer carries. The body is the branch commit
  # messages — the pull request BODY reaches `main` on none of #512, #514, #515
  # or #518, which is why it is deliberately not read here. A footer written only
  # in the body would be accepted by this job and then never seen by
  # release-please, which is the exact false green the job exists to remove.
  #
  # 🕳️ **The fourteenth is the honest blind spot: the title PREDICTS the subject,
  # it does not fix it.** #353 landed as `feat(gallery): nod, a sixth example…`
  # under the title `A sixth gallery example: nod, …` — GitHub lets the squash
  # subject be rewritten in the merge box, after this job has reported. So a
  # green here can still be followed by an edit that hides the landing, and
  # nothing available at pull request time can see that. The instrument that
  # could is the OTHER shape #516 names — a check at release time, comparing the
  # allowlist against the last tag — and this job does not replace it.
  #
  # ⛔ **A `!` or a `BREAKING CHANGE:` footer is NOT accepted as visibility, and
  # that is a guess refused rather than made.** Whether release-please bumps a
  # version off a breaking marker carried by a HIDDEN type is not something this
  # repository has measured, and the two errors are not symmetric: reading it as
  # visible buys a silent miss of the defect this job is for, and reading it as
  # hidden costs an author one word in a subject line. Measure it and this is the
  # line to change.
  #
  # 🔒 **Why here and not in `selftest.ts`**, the same reason as `removals`: what
  # a revision ships is a property of one commit, but what a LANDING ships is a
  # RELATION between two, and on a checkout at `main` `git merge-base HEAD main`
  # is `HEAD`, so the comparison would be empty by construction and would pass by
  # comparing a revision with itself.
  #
  # ⛔ This job is not a required check until somebody makes it one in the
  # repository settings, which is not a thing a file in the tree can assert.
  ships:
    # A relation between a branch and its base. A push to `main` has no such
    # relation to read, which is the same fact that keeps this out of the suite.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history and tags, stated rather than inherited: `git merge-base`
      # needs both sides, and the last control below reads the subject of a real
      # cut off the newest reachable tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The npm that reads the allowlist. `release.yml` publishes with
      # `npm@latest`; npm 10.9.7 and npm 12.0.2 were measured to pack the
      # identical 55 paths out of `v0.20.0`, so the runner own npm is read here
      # and the parser below accepts both of their `--json` shapes (an array in
      # npm 10, an object keyed by package name in npm 12). A packlist SEMANTICS
      # change between npm majors is a difference this job cannot see, and that
      # is stated rather than guarded.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: A landing that changes the package is visible to the release
        # 🔒 Through the environment and never interpolated into the script. A
        # pull request title is written by whoever opened it, so `${{ }}` inside
        # `run:` would be executing a stranger text. The BODY is not passed at
        # all — see the comment above for the measurement that decided it.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # `sort` and `comm` have to agree on a collation, and a node-side sort
          # is not in the loop: every list below is ordered by this one `sort`.
          export LC_ALL=C
          # GitHub default shell is `bash -e`, which does not include pipefail,
          # and several readers here sit behind a pipe — including the one that
          # turns `npm pack --json` into the list everything else is judged
          # against, where a silent failure would answer an empty package.
          set -o pipefail

          work=$(mktemp -d)
          base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")

          # What release-please can see, derived from the branch own config
          # rather than listed here: un-hiding a type moves this job with it, and
          # there is no table to fall out of date.
          git show "$HEAD_SHA:release-please-config.json" > "$work/rp.json"
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const sections = cfg["changelog-sections"] || [];
            const w = (f, a) => fs.writeFileSync(f, a.length ? a.join("\n") + "\n" : "");
            w(process.argv[2], sections.filter(s => !s.hidden).map(s => s.type));
            w(process.argv[3], sections.filter(s => s.hidden).map(s => s.type));
            const pat = cfg["pull-request-title-pattern"] || "chore${scope}: release${component} ${version}";
            const esc = pat.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            w(process.argv[4], ["^" + esc.replace(/\\\$\\\{[A-Za-z]+\\\}/g, ".+") + "$"]);
            w(process.argv[5], [pat.replace(/\$\{[A-Za-z]+\}/g, "0.0.0")]);
          ' "$work/rp.json" "$work/visible" "$work/hidden" "$work/release-title" "$work/release-sample"

          # What npm would actually pack, at both ends of the relation, read out
          # of an extraction of each revision rather than out of the working
          # tree: the base side is a revision this checkout is not standing on.
          ships () { # $1 rev, $2 label
            mkdir -p "$work/tree-$2"
            git archive "$1" | tar -x -C "$work/tree-$2"
            if ! npm pack --dry-run --json "$work/tree-$2" > "$work/pack-$2.json" 2> "$work/pack-$2.err"; then
              cat "$work/pack-$2.err"
              echo "npm pack --dry-run failed on $1, so nothing is known about what ships and this job will not report green"
              exit 1
            fi
            node -e '
              const fs = require("fs");
              const raw = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              const entries = Array.isArray(raw) ? raw : Object.values(raw);
              const files = entries && entries[0] && entries[0].files;
              if (!Array.isArray(files) || files.length === 0) {
                console.error("npm pack --dry-run --json answered a shape this job does not understand, or an empty file list");
                process.exit(1);
              }
              for (const f of files) console.log(f.path);
            ' "$work/pack-$2.json" | sort > "$work/$2"
          }
          ships "$base" base
          ships "$HEAD_SHA" head

          # The UNION of the two, so a path that ships at the base and stops
          # shipping on the branch is still a change to the package.
          sort -u "$work/base" "$work/head" > "$work/ships"

          # The allowlist as the filesystem reads it, for the one row below that
          # says which of the two readings this job is doing.
          node -e '
            const fs = require("fs"), p = require("path");
            const dir = process.argv[1];
            const files = JSON.parse(fs.readFileSync(p.join(dir, "package.json"), "utf8")).files || [];
            const packed = fs.readFileSync(process.argv[2], "utf8").split("\n").filter(Boolean);
            const rows = files.map(e => packed.filter(x => x === e || x.indexOf(e + "/") === 0).length + " " + e);
            fs.writeFileSync(process.argv[3], rows.join("\n") + "\n");
            const lit = [];
            const walk = (rel) => {
              const abs = p.join(dir, rel);
              if (!fs.existsSync(abs)) return;
              if (fs.statSync(abs).isDirectory()) { for (const n of fs.readdirSync(abs)) walk(rel + "/" + n); }
              else lit.push(rel);
            };
            files.forEach(walk);
            for (const f of lit) console.log(f);
          ' "$work/tree-head" "$work/head" "$work/rows" | sort > "$work/literal"

          # 🚨 The floor, one row per allowlist ENTRY and never one on their sum
          # — the correction #510 made to `DQ01` and #512 made to its own scope,
          # arrived at the same way. A narrowing of what this job calls "shipped"
          # narrows BOTH revisions at once and is therefore invisible to a
          # base-against-branch comparison, so the scope is held against the
          # tree. It also catches a file deleted while its entry stays in
          # `files`, which silently drops it out of the published package.
          thin=0
          while read -r n entry; do
            echo "  files[] $entry -> $n packed path(s)"
            if [ "$n" -eq 0 ]; then thin=$((thin + 1)); fi
          done < "$work/rows"
          if [ "$thin" -gt 0 ]; then
            echo "$thin allowlist entry(ies) contributed nothing to the pack, so this scan is reading less of the package than the allowlist says"
            exit 1
          fi

          # 🚨 The row that says WHICH reading this is, and the check #516 asked
          # for by name. npm always adds `package.json`, the README and the
          # LICENCE on top of the allowlist, so a run that finds npm adding
          # nothing has regressed to expanding the array by hand — and `README.md`
          # would be invisible to it.
          comm -13 "$work/literal" "$work/head" > "$work/beyond"
          nbeyond=$(( $(wc -l < "$work/beyond") ))
          echo "  npm packs $(( $(wc -l < "$work/head") )) path(s) where a literal expansion of files[] yields $(( $(wc -l < "$work/literal") )); npm adds $nbeyond of its own:" $(cat "$work/beyond")
          if [ "$nbeyond" -eq 0 ]; then
            echo "the pack and the allowlist agree exactly, which is what reading the array instead of npm looks like"
            exit 1
          fi

          git diff --name-only "$base" "$HEAD_SHA" | sort > "$work/changed"
          nc=$(( $(wc -l < "$work/changed") ))
          echo "base $base packs $(( $(wc -l < "$work/base") )) path(s), this branch packs $(( $(wc -l < "$work/head") )), and the branch changes $nc file(s)"

          # 🚨 An empty change set is NOT a fault, and the first version of this
          # made it one. Replayed over the 205 landings since the config grew a
          # `changelog-sections` array, that produced exactly one red on #290,
          # whose tree is byte-identical to its parent — a landing that changed
          # nothing moves no package, and the honest verdict for it is the quiet
          # one. The reader still needs a control, because a BROKEN diff and an
          # empty branch look the same from the branch side; so the control is
          # held against the tree, the way #512 says a scope has to be: the diff
          # from the empty tree to this revision is the whole revision.
          probe=$(( $(git diff --name-only "$(git hash-object -t tree /dev/null)" "$HEAD_SHA" | wc -l) ))
          echo "  control  the changed-file reader answers $probe path(s) for the whole of $HEAD_SHA"
          if [ "$probe" -eq 0 ]; then
            echo "control: the changed-file reader answered nothing for an entire revision, so its answer above means nothing either"
            exit 1
          fi

          # Whether release-please would see this landing at all. Prints the
          # reason either way, because the reason is the whole diagnostic.
          visible () { # $1 subject, $2 file of commit message bodies
            if printf '%s\n' "$1" | grep -qE -f "$work/release-title"; then
              echo "this landing IS the release: its subject matches pull-request-title-pattern"
              return 0
            fi
            t=$(printf '%s\n' "$1" | sed -nE 's/^([A-Za-z]+)(\([^)]*\))?!?:.*/\1/p')
            if [ -n "$t" ] && grep -qxF "$t" "$work/visible"; then
              echo "typed $t, which release-please does not hide"
              return 0
            fi
            if grep -qiE '^[[:space:]]*Release-As:' "$2"; then
              echo "a Release-As: footer in a commit message on this branch"
              return 0
            fi
            if [ -z "$t" ]; then
              echo "the subject carries no conventional-commit type, so release-please reads nothing from it"
            else
              echo "typed $t, which release-please hides from the changelog"
            fi
            return 1
          }

          # The judgement, written once so the controls below and the real run
          # are the same code rather than two copies of it agreeing with each
          # other.
          judge () { # $1 changed paths, $2 subject, $3 commit bodies, $4 row prefix
            comm -12 "$1" "$work/ships" > "$work/touched"
            n=$(( $(wc -l < "$work/touched") ))
            if why=$(visible "$2" "$3"); then seen=1; else seen=0; fi
            invisible=0
            if [ "$n" -eq 0 ]; then
              echo "$4changes no packed file — $why"
            elif [ "$seen" -eq 1 ]; then
              echo "$4$n packed file(s) change and the release will carry them — $why"
            else
              invisible=$n
              while read -r f; do
                echo "$4SHIPS-UNSEEN  $f is inside the published package, and this landing is $why"
              done < "$work/touched"
            fi
          }

          # 🚨 The judgement controls: FOUR of them, plus a fifth row here that
          # is not a judgement (the reader control above this block is a sixth).
          # Two-sided in both directions the card asks for — a packed path under
          # a hidden type has to be reported, a packed path under a visible type
          # has to not be, and an unpacked path under a hidden type has to not
          # be. The fourth is the release exemption; the fifth holds the pattern
          # against a real cut instead of against the string it came from. All of
          # them run on paths and types taken off this tree rather than written
          # here, and the first four go through the same `judge` as the verdict
          # below rather than a second copy of it agreeing with the first.
          shipPath=$(head -n 1 "$work/ships")
          git ls-tree -r --name-only "$HEAD_SHA" | sort > "$work/tracked"
          comm -23 "$work/tracked" "$work/ships" > "$work/offpaths"
          offPath=$(head -n 1 "$work/offpaths")
          hiddenType=$(head -n 1 "$work/hidden")
          visibleType=$(head -n 1 "$work/visible")
          if [ -z "$shipPath" ] || [ -z "$offPath" ] || [ -z "$hiddenType" ] || [ -z "$visibleType" ]; then
            echo "control: the tree offers no packed path, no unpacked path, no hidden type or no visible type, so the cases below cannot differ and nothing here exercised the rule"
            exit 1
          fi
          : > "$work/c-said"

          printf '%s\n' "$shipPath" > "$work/c-changed"
          judge "$work/c-changed" "$hiddenType: a subject this repository hides" "$work/c-said" "  control  "
          if [ "$invisible" -ne 1 ]; then
            echo "control: $shipPath is packed and $hiddenType is hidden, and the judgement did not report it"
            exit 1
          fi

          judge "$work/c-changed" "$visibleType: a subject this repository publishes" "$work/c-said" "  control  "
          if [ "$invisible" -ne 0 ]; then
            echo "control: $shipPath is packed under the visible type $visibleType, which releases, and the judgement reported it anyway"
            exit 1
          fi

          printf '%s\n' "$offPath" > "$work/c-changed"
          judge "$work/c-changed" "$hiddenType: a subject this repository hides" "$work/c-said" "  control  "
          if [ "$invisible" -ne 0 ]; then
            echo "control: $offPath is not packed and the judgement reported it under the hidden type $hiddenType"
            exit 1
          fi

          # The release pull request changes `package.json`, which ships, under a
          # subject that is not a listed type at all — so the exemption is real
          # and it has to be REACHABLE or every cut goes red. Two rows: the first
          # proves the exemption fires, the second holds the derived regex
          # against a real cut out of this repository history rather than against
          # the string it was derived from.
          printf '%s\n' "$shipPath" > "$work/c-changed"
          judge "$work/c-changed" "$(cat "$work/release-sample")" "$work/c-said" "  control  "
          if [ "$invisible" -ne 0 ]; then
            echo "control: $(cat "$work/release-sample") is what pull-request-title-pattern produces and the exemption did not fire, so every release pull request would go red"
            exit 1
          fi
          lastTag=$(git describe --tags --abbrev=0 "$base" 2> /dev/null || true)
          if [ -z "$lastTag" ]; then
            echo "  control  SKIP  no tag is reachable from $base, so the release-title pattern was not held against a real cut"
          else
            realTitle=$(git log -1 --format=%s "$lastTag" | sed -E 's/ \(#[0-9]+\)$//')
            if printf '%s\n' "$realTitle" | grep -qE -f "$work/release-title"; then
              echo "  control  the pattern matches the real cut at $lastTag: $realTitle"
            else
              echo "control: the pattern derived from pull-request-title-pattern does not match the subject of the real cut at $lastTag ($realTitle), so the exemption would not fire on a cut"
              exit 1
            fi
          fi

          # What the change says about itself, and where it says it. See the
          # comment above the job for the measurement that puts the type in the
          # title and `Release-As:` in the commits.
          git log --format=%B "$base..$HEAD_SHA" > "$work/said"
          judge "$work/changed" "$PR_TITLE" "$work/said" "  "

          if [ "$invisible" -gt 0 ]; then
            echo "$invisible file(s) inside the published package change on this branch and no release will open for them"
            echo "the verdict is not that the type is wrong: a doc correction really is a docs change, and what is missing is that it also ships"
            echo "either of these settles it — land it under a type release-please does not hide ($(tr "\n" " " < "$work/visible")), or put a Release-As: footer in a COMMIT MESSAGE on this branch, which is what the squash body is made of, and not in the pull request body, which reaches nothing"
            echo "taking the path back out of files[] in package.json is not a third remedy: package.json is itself packed, so that edit lands under this same rule"
            exit 1
          fi
          echo "the package moves only where the release can see it"
